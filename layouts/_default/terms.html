{{ define "main" }}
  {{ partial "breadcrumbs.html" . }}
  <header class="stack">
    <h1>{{ .Title }}</h1>
  </header>
  <div class="list-grid">
    {{ range .Data.Terms.Alphabetical }}
      <article class="card">
        <h2 class="card__title"><a href="{{ .Page.RelPermalink }}">{{ .Page.Title }}</a></h2>
        <p class="card__meta">{{ .Count }} items</p>
      </article>
    {{ end }}
  </div>
{{ end }}
