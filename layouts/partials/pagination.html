{{- $p := .Paginator }}
{{- if gt $p.TotalPages 1 }}
<nav class="pagination" aria-label="Pagination">
  {{- if $p.HasPrev }}
    <a href="{{ $p.Prev.URL }}">Previous</a>
  {{- else }}
    <span class="meta">Previous</span>
  {{- end }}
  <span class="meta">Page {{ $p.PageNumber }} of {{ $p.TotalPages }}</span>
  {{- if $p.HasNext }}
    <a href="{{ $p.Next.URL }}">Next</a>
  {{- else }}
    <span class="meta">Next</span>
  {{- end }}
</nav>
{{- end }}
